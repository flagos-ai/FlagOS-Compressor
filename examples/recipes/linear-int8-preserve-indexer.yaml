version: 1
method: mse
bits: 8
activation_bits: 8
strategy: channel
scale_dtype: fp32
n_candidates: 200
select:
  - linear
  # DeepSeek-V4.1 uses a Linear patch projection; MiMo's 5D Conv3d is excluded.
  - name: '^vision\.patch_embed\.proj\.weight$'
exclude:
  - name: '(^|\.)indexer(\.|$)'
unselected:
  strategy: preserve
